plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

// Tự động đồng bộ (Sync) file jar vừa build của các subproject về thư mục root build/libs
// Sync sẽ tự động xóa sạch các file jar của version cũ trong build/libs
tasks.register('collectJars', Sync) {
    into layout.buildDirectory.dir("libs")
    
    subprojects.each { subproject ->
        dependsOn subproject.tasks.matching { t -> t.name == 'jar' }
        from(subproject.tasks.matching { t -> t.name == 'jar' })
    }
}

build.finalizedBy collectJars
