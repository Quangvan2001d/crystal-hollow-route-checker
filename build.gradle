plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

// Copy built mod jars from all subprojects to root build/libs
tasks.register('collectJars', Copy) {
    into layout.buildDirectory.dir("libs")
    
    subprojects.each { subproject ->
        dependsOn subproject.tasks.matching { t -> t.name == 'jar' || t.name == 'remapJar' }
        from(subproject.layout.buildDirectory.dir("libs")) {
            include "*.jar"
            exclude "*-dev.jar", "*-sources.jar"
        }
    }
}

build.finalizedBy collectJars
